<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STC Client Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>STCClient 控制台</h1>
    <p>节点状态、吞吐监控与攻击测试</p>
  </header>

  <main>
    <section class="card">
      <h2>网络控制</h2>
      <button id="startNet">启动网络</button>
      <button id="stopNet">关闭网络</button>
    </section>

    <section class="card">
      <h2>吞吐测试</h2>
      <label>速率 TPS <input id="rate" type="number" value="100000" /></label>
      <label>时长 秒 <input id="duration" type="number" value="120" /></label>
      <button id="throughput">开始</button>
    </section>

    <section class="card">
      <h2>节点操控</h2>
      <label>分片 <input id="shard" type="number" value="0" /></label>
      <label>节点 <input id="node" type="number" value="0" /></label>
      <button id="forge">伪造时空一次</button>
      <button id="byzOn">拜占庭开启</button>
      <button id="byzOff">拜占庭关闭</button>
    </section>

    <section class="card">
      <h2>区块哈希查询</h2>
      <label>开始高度 <input id="start" type="number" value="0" /></label>
      <label>结束高度 <input id="end" type="number" value="50" /></label>
      <button id="queryBlocks">查询</button>
      <pre id="blocks"></pre>
    </section>

    <section class="card">
      <h2>节点状态</h2>
      <pre id="status"></pre>
    </section>

    <section class="card">
      <h2>分片指标</h2>
      <pre id="metrics"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
